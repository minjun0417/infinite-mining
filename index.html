<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무한 채굴단 - Infinite Mining Squad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Login View -->
        <section id="login-view" class="view">
            <h1 class="game-title">무한 채굴단</h1>
            <p class="game-subtitle">INFINITE MINING SQUAD</p>
            <div class="input-group">
                <input type="text" id="digger-name" placeholder="대원 코드명을 입력하세요..." maxlength="10">
            </div>
            <button id="start-btn" class="industrial-btn">채굴 시작</button>
        </section>

        <!-- Game View -->
        <section id="game-view" class="view hidden">
            <header class="game-header">
                <div class="top-bar">
                    <div class="user-info">
                        <span id="display-name">Digger</span> 대원
                    </div>
                    <button id="open-shop-btn" class="industrial-btn small-btn">🛒 환전소 열기</button>
                </div>
                <div class="stats">
                    <div class="stat-item" title="Stone">
                        <svg viewBox="0 0 24 24" width="28" height="28"><defs><linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a4b0be" /><stop offset="100%" stop-color="#57606f" /></linearGradient></defs><path fill="url(#stoneGrad)" d="M12 2L3 8l2 12h14l2-12z" stroke="#2f3542" stroke-width="1.5"/></svg>
                        <span id="stone-count" class="value">0</span>
                    </div>
                    <div class="stat-item" title="Iron">
                        <svg viewBox="0 0 24 24" width="28" height="28"><defs><linearGradient id="ironGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#dfe4ea" /><stop offset="100%" stop-color="#747d8c" /></linearGradient></defs><rect x="3" y="7" width="18" height="10" rx="2" fill="url(#ironGrad)" stroke="#57606f" stroke-width="1.5"/><line x1="5" y1="11" x2="19" y2="11" stroke="#ffffff" stroke-width="1" opacity="0.5"/></svg>
                        <span id="iron-count" class="value">0</span>
                    </div>
                    <div class="stat-item" title="Gold">
                        <svg viewBox="0 0 24 24" width="28" height="28"><defs><linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#eccc68" /><stop offset="100%" stop-color="#ffa502" /></linearGradient></defs><rect x="3" y="7" width="18" height="10" rx="2" fill="url(#goldGrad)" stroke="#d35400" stroke-width="1.5"/><line x1="5" y1="11" x2="19" y2="11" stroke="#ffffff" stroke-width="1" opacity="0.6"/></svg>
                        <span id="gold-count" class="value">0</span>
                    </div>
                    <div class="stat-item" title="Diamond">
                        <svg viewBox="0 0 24 24" width="28" height="28"><defs><linearGradient id="diaGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7bed9f" /><stop offset="100%" stop-color="#1e90ff" /></linearGradient></defs><path fill="url(#diaGrad)" d="M12 2L2 8l10 14 10-14z" stroke="#3742fa" stroke-width="1.5"/><polygon fill="rgba(255,255,255,0.4)" points="12,2 6,8 12,22" /></svg>
                        <span id="diamond-count" class="value">0</span>
                    </div>
                    <div class="stat-item" title="Money">
                        <svg viewBox="0 0 24 24" width="28" height="28"><defs><linearGradient id="moneyGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2ed573" /><stop offset="100%" stop-color="#009432" /></linearGradient></defs><rect x="2" y="6" width="20" height="12" rx="2" fill="url(#moneyGrad)" stroke="#006266" stroke-width="1.5"/><circle cx="12" cy="12" r="3" fill="#ffffff" opacity="0.8"/></svg>
                        <span id="money-count" class="value">0</span>
                    </div>
                </div>
            </header>
            
            <main class="game-main">
                <div class="mining-area">
                    <div id="big-rock" class="rock"></div>
                    <div class="hp-bar-container">
                        <div id="hp-bar-fill" class="hp-bar-fill"></div>
                    </div>
                </div>
            </main>
        </section>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-shop-btn" class="close-btn">&times;</button>
            <h2 class="panel-title">환전소 (EXCHANGE)</h2>
            <div class="shop-items">
                <button id="buy-iron" class="shop-btn">
                    <span class="cost">돌 1,000</span> ➡️ <span class="reward">철 1</span>
                </button>
                <button id="buy-gold" class="shop-btn">
                    <span class="cost">철 1,000</span> ➡️ <span class="reward">금 1</span>
                </button>
                <button id="buy-diamond" class="shop-btn">
                    <span class="cost">금 1,000</span> ➡️ <span class="reward">다이아 1</span>
                </button>
                <button id="buy-money" class="shop-btn special">
                    <span class="cost">다이아 1,000</span> ➡️ <span class="reward">돈 50</span>
                </button>
            </div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
